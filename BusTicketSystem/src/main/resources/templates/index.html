<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Ticket Reservation System</title>
    <style>
        /* CSS Styling to make it look good */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Background image of a bus/road */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
            url('https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?q=80&w=2069&auto=format&fit=crop') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            }

            .search-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .search-container h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .search-container p {
            color: #666;
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            flex: 1;
            min-width: 200px;
        }

        .input-group label {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-group input {
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #007BFF;
        }

        .search-btn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .search-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="search-container">
    <h1>🚌 Book Your Bus Ticket</h1>
    <p>Find and reserve your seat in seconds.</p>

    <form class="search-form" th:action="@{/results}" method="get">

        <div class="input-group">
            <label for="source">From</label>
            <input type="text" id="source" name="source" value="Dar es Salaam" placeholder="e.g., Dar es Salaam" required>
        </div>

        <div class="input-group">
            <label for="destination">To</label>
            <input type="text" id="destination" name="destination" value="Dodoma" placeholder="e.g., Dodoma" required>
        </div>

        <div class="input-group">
            <label for="date">Date of Travel</label>
            <input type="date" id="date" name="date" required>
        </div>

        <button type="submit" class="search-btn">Search Buses</button>
    </form>
    <p style="margin-top: 20px;"><a th:href="@{/admin}">Admin panel</a></p>
</div>

<script>
    const searchParams = new URLSearchParams(window.location.search);
    const source = searchParams.get('source');
    const destination = searchParams.get('destination');
    const date = searchParams.get('date');
    if (source) document.getElementById('source').value = source;
    if (destination) document.getElementById('destination').value = destination;
    const dateInput = document.getElementById('date');
    const today = new Date();
    const localToday = new Date(today.getTime() - today.getTimezoneOffset() * 60000)
        .toISOString().slice(0, 10);
    dateInput.min = localToday;
    dateInput.value = date || localToday;
</script>
</body>
</html>
