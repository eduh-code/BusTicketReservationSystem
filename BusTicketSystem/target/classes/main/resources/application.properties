server.port=8080

# Set DB_PASSWORD in the IntelliJ run configuration to the MySQL root password.
spring.datasource.url=jdbc:mysql://localhost:3306/bus_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Create required tables before Hibernate adds columns and constraints to existing tables.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Pesapal API 3.0. Use sandbox credentials for development and production credentials only after merchant onboarding.
pesapal.base-url=${PESAPAL_BASE_URL:https://cybqa.pesapal.com/pesapalv3}
pesapal.consumer-key=${PESAPAL_CONSUMER_KEY:}
pesapal.consumer-secret=${PESAPAL_CONSUMER_SECRET:}
pesapal.ipn-id=${PESAPAL_IPN_ID:}
pesapal.callback-url=${PESAPAL_CALLBACK_URL:}
