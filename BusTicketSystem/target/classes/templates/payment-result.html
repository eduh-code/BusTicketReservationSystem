<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checking payment - Bus Ticket Reservation</title>
    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
        body { margin: 0; padding: 24px; background: #f2f5f8; color: #263238; }
        main { max-width: 560px; margin: 50px auto; padding: 28px; background: white; border-radius: 14px; box-shadow: 0 8px 28px #00000014; }
        h1 { color: #087b43; }
        #status { padding: 14px; background: #f5f8f6; border-radius: 8px; }
        a { color: #1267a5; }
    </style>
</head>
<body th:attr="data-app-root=@{/},data-tracking-id=${payment.providerTrackingId},data-merchant-reference=${payment.merchantReference},data-payment-status=${payment.status}">
<main>
    <h1>Payment status</h1>
    <p id="status">Pesapal reports: <strong th:text="${payment.status}"></strong>. Checking for confirmation…</p>
    <p>Your ticket will be created only after the provider confirms payment.</p>
    <p><a th:href="@{/payment(bookingId=${booking.id})}">Return to payment</a></p>
    <p><a th:href="@{/}">Start a new search</a></p>
</main>
<script>
    const root = document.body.dataset.appRoot;
    const params = new URLSearchParams({
        OrderTrackingId: document.body.dataset.trackingId,
        OrderMerchantReference: document.body.dataset.merchantReference
    });
    const statusElement = document.getElementById('status');
    let attempts = 0;

    async function checkStatus() {
        try {
            const response = await fetch(`${root}api/payments/status?${params}`);
            const result = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(result.message || result.error || `Status check failed (${response.status})`);
            }
            if (result.status === 'COMPLETED' && result.ticketNumber) {
                window.location.assign(`${root}ticket/${encodeURIComponent(result.ticketNumber)}`);
                return;
            }
            if (result.status === 'FAILED') {
                statusElement.textContent = 'Payment was not completed. Return to your payment link to try again.';
                return;
            }
            attempts += 1;
            statusElement.textContent = `Payment is ${result.status.toLowerCase()}. Checking again…`;
            if (attempts < 12) {
                window.setTimeout(checkStatus, 5000);
            } else {
                statusElement.textContent = 'Payment is still pending. You may refresh this page later to check again.';
            }
        } catch (error) {
            statusElement.textContent = error.message || 'Unable to verify payment status right now.';
        }
    }

    if (document.body.dataset.paymentStatus === 'PENDING') {
        window.setTimeout(checkStatus, 3000);
    }
</script>
</body>
</html>
