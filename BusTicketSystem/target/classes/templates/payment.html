<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment - Bus Ticket Reservation</title>
    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
        body { margin: 0; padding: 24px; background: #f2f5f8; color: #263238; }
        main { max-width: 560px; margin: 35px auto; padding: 28px; border-radius: 14px; background: white; box-shadow: 0 8px 28px #00000014; }
        h1 { color: #087b43; }
        label { display: block; margin: 18px 0 7px; font-weight: 600; }
        input, select, button { width: 100%; padding: 12px; border: 1px solid #ccd3d8; border-radius: 7px; font-size: 16px; }
        button { margin-top: 22px; background: #087b43; border: 0; color: white; font-weight: 700; cursor: pointer; }
        button:disabled { background: #8a9690; cursor: wait; }
        .summary { padding: 14px; background: #f5f8f6; border-radius: 8px; line-height: 1.8; }
        #message { margin-top: 15px; color: #b00020; }
        a { color: #1267a5; }
    </style>
</head>
<body th:attr="data-app-root=@{/}">
<main>
    <h1>Complete your payment</h1>
    <div class="summary">
        <div><strong>Bus:</strong> <span th:text="${booking.bus.busName}"></span></div>
        <div><strong>Route:</strong> <span th:text="${booking.bus.source}"></span> to
            <span th:text="${booking.bus.destination}"></span></div>
        <div><strong>Seats:</strong> <span th:text="${booking.selectedSeats}"></span></div>
        <div><strong>Total:</strong> Tshs
            <span th:text="${#numbers.formatDecimal(booking.totalPrice, 1, 'COMMA', 0, 'POINT')}"></span>/=
        </div>
    </div>
    <form id="paymentForm">
        <input type="hidden" id="bookingId" th:value="${booking.id}">
        <p>Continue to Pesapal's secure checkout to choose a mobile-money provider available to your account, such as M-Pesa, Mixx by Yas, Airtel Money, or Halopesa.</p>
        <label for="phoneNumber">Tanzanian phone number</label>
        <input id="phoneNumber" name="phoneNumber" type="tel" inputmode="numeric"
               pattern="0[67][0-9]{8}" placeholder="07XXXXXXXX" minlength="10" maxlength="10" required>
        <button id="payButton" type="submit">Pay Tshs
            <span th:text="${#numbers.formatDecimal(booking.totalPrice, 1, 'COMMA', 0, 'POINT')}"></span>/=
        </button>
        <p id="message" role="alert"></p>
    </form>
    <p><a th:href="@{/results(source=${booking.bus.source},destination=${booking.bus.destination})}">
        Return to available buses</a></p>
</main>
<script>
    const appRoot = document.body.dataset.appRoot;
    const paymentForm = document.getElementById('paymentForm');
    paymentForm.addEventListener('submit', async event => {
        event.preventDefault();
        const button = document.getElementById('payButton');
        const message = document.getElementById('message');
        button.disabled = true;
        message.textContent = '';

        try {
            const response = await fetch(`${appRoot}api/payments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    bookingId: Number(document.getElementById('bookingId').value),
                    phoneNumber: document.getElementById('phoneNumber').value.trim()
                })
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(result.message || result.error || result.detail || `Payment failed (${response.status})`);
            }
            if (result.status !== 'PENDING' || !result.redirectUrl) {
                throw new Error('Payment checkout was not created. Please contact the administrator.');
            }
            const checkoutUrl = new URL(result.redirectUrl);
            if (checkoutUrl.protocol !== 'https:' ||
                !(checkoutUrl.hostname === 'pesapal.com' || checkoutUrl.hostname.endsWith('.pesapal.com'))) {
                throw new Error('The payment provider returned an invalid checkout URL.');
            }
            window.location.assign(checkoutUrl.href);
        } catch (error) {
            message.textContent = error.message || 'Unable to process the simulated payment.';
            button.disabled = false;
        }
    });
</script>
</body>
</html>
